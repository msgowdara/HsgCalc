<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godown Inspector (Cloud Sync Version)</title>
    
    <!-- Standard React CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Utilities: Tailwind, Babel, and PapaParse (For CSV operations) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        @media print {
            body { background-color: white !important; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #report-container { box-shadow: none !important; margin: 0 !important; padding: 0 0 50px 0 !important; width: 100% !important; max-width: none !important; }
            ::-webkit-scrollbar { display: none; }
            .page-break-avoid { page-break-inside: avoid; }
            /* Force break and attempt to force to next right/odd page for duplex printing */
            .page-break-before { page-break-before: always; break-before: right; }
            
            .print-only-footer { 
                display: block; position: fixed; bottom: 0; left: 0; width: 100%;
                text-align: center; font-size: 11pt; font-family: "Times New Roman", Times, serif; font-weight: bold;
                background: white; border-top: 1px solid black; padding-top: 5px; padding-bottom: 5px; z-index: 1000;
            }
            .screen-only-footer { display: none !important; }
        }
        
        .a4-page {
            width: 210mm; min-height: 297mm; background: white; margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 20mm 15mm;
        }

        .word-doc {
            font-family: "Times New Roman", Times, serif; font-size: 11pt; line-height: 1.25; color: black;
        }
        .word-doc .doc-grid {
            display: grid; grid-template-columns: 4.4in 1fr; margin-bottom: 2pt; page-break-inside: avoid;
        }
        .word-doc h2 {
            font-size: 11pt; font-weight: bold; margin-top: 14pt; margin-bottom: 4pt; text-transform: uppercase; page-break-after: avoid;
        }
        .print-only-footer { display: none; }
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <!-- BEGIN MAIN MENU RIBBON -->
    <nav class="no-print" style="background-color: #1e3a8a; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; font-family: system-ui, -apple-system, sans-serif; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <div style="font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px;">
            Banking Tools
        </div>
        <a href="https://msgowdara.github.io/HsgCalc/" style="color: white; text-decoration: none; background-color: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: background-color 0.2s; display: inline-flex; align-items: center; gap: 6px;" onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.25)'" onmouseout="this.style.backgroundColor='rgba(255, 255, 255, 0.15)'">
            <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Main Menu
        </a>
    </nav>
    <!-- END MAIN MENU RIBBON -->

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        // --- Extracted Excel Dropdowns ---
        const DROPDOWNS = {
            conditions: ["Satisfactory", "Not Satisfactory"],
            storage: ["Proper", "Haphazard"],
            yesNo: ["Yes", "No", "Not Applicable"],
            insideOutside: ["Inside", "Outside", "Not Applicable"],
            frequency: ["Monthly", "Quarterly", "Half Yearly", "Yearly", "Irregular"],
            authorities: ["BRCM", "RLCC", "CAC", "ZO", "HO"],
            margins: ["0", "10", "15", "20", "25", "30", "40", "50"]
        };

        // --- Auto-Suggested Remarks Dictionary & Letter Mapping ---
        const SUGGESTED_REMARKS = {
            conditionOfGodown: { trigger: 'Not Satisfactory', field: 'godownRemark', label: 'Condition of Godown', resp: 'Borrower', text: "Godown requires maintenance/cleaning." },
            conditionOfStocks: { trigger: 'Not Satisfactory', field: 'conditionOfStocksRemark', label: 'Condition of Stocks', resp: 'Borrower', text: "Some stocks appear damaged/obsolete." },
            modeOfStorage: { trigger: 'Haphazard', field: 'modeOfStorageRemark', label: 'Mode of Storage', resp: 'Borrower', text: "Advised customer to arrange and stack goods properly." },
            modeOfValuationSatisfactory: { trigger: 'Not Satisfactory', field: 'valuationRemark', label: 'Valuation Mode', resp: 'Branch', text: "Valuation is not in line with current market rates." },
            tradeDiscountDeducted: { trigger: 'No', field: 'tradeDiscountRemark', label: 'Trade Discount', resp: 'Branch', text: "Trade discount is not deducted from valuation." },
            insuranceAdequate: { trigger: 'No', field: 'insuranceAdequateRemark', label: 'Insurance Adequacy', resp: 'Borrower', text: "Advised customer to increase insurance cover to match limit." },
            insuranceComprehensive: { trigger: 'No', field: 'insuranceComprehensiveRemark', label: 'Comprehensive Insurance', resp: 'Borrower', text: "Advised to obtain comprehensive insurance policy." },
            unpledgedInsured: { trigger: 'No', field: 'unpledgedInsuredRemark', label: 'Unpledged Stocks Insurance', resp: 'Borrower', text: "Unpledged stocks are currently uninsured." },
            signboardsDisplayed: { trigger: 'No', field: 'signboardsDisplayedRemark', label: 'Bank Signboards', resp: 'Borrower', text: "Advised customer to display Bank's signboard immediately." },
            godownKeeperSanctioned: { trigger: 'No', field: 'godownKeeperRemark', label: 'Godown Keeper', resp: 'Branch', text: "Godown keeper not sanctioned/required for this account." },
            stockReportsRegular: { trigger: 'No', field: 'stockReportsRemark', label: 'Stock Reports Submission', resp: 'Borrower', text: "Advised customer to submit stock statements promptly." },
            bankPossessionEffective: { trigger: 'No', field: 'bankPossessionRemark', label: 'Bank Possession', resp: 'Branch', text: "Advised branch to ensure strict possession of godown." },
            registersMaintained: { trigger: 'No', field: 'registersMaintainedRemark', label: 'Stock Registers', resp: 'Borrower', text: "Advised customer to maintain proper stock registers." },
            registersTally: { trigger: 'No', field: 'registersTallyRemark', label: 'Registers Tally', resp: 'Both', text: "Discrepancy observed between physical stock and records." },
            inspectedPeriodically: { trigger: 'No', field: 'inspectedPeriodicallyRemark', label: 'Periodical Inspection', resp: 'Branch', text: "Advised branch to strictly follow inspection schedule." },
            recordMaintained: { trigger: 'No', field: 'recordMaintainedRemark', label: 'Inspection Records', resp: 'Branch', text: "Advised branch to update inspection records." },
            turnoverSatisfactory: { trigger: 'No', field: 'turnoverSatisfactoryRemark', label: 'Stock Turnover', resp: 'Borrower', text: "Turnover is not commensurate with the limit." },
            accountTurnoverSatisfactory: { trigger: 'No', field: 'accountTurnoverSatisfactoryRemark', label: 'Account Turnover', resp: 'Borrower', text: "Advised the customer to route all sales proceeds through Cash Credit Account only." },
            movementChecked: { trigger: 'No', field: 'movementRemark', label: 'Stock Movement', resp: 'Branch', text: "Movement of stocks needs closer monitoring." },
            oldStockMoving: { trigger: 'No', field: 'oldStockRemark', label: 'Old Stock Movement', resp: 'Borrower', text: "Old stocks are slow-moving; advised early liquidation." },
            deliveriesNotNew: { trigger: 'No', field: 'deliveriesRemark', label: 'Deliveries Preponderance', resp: 'Both', text: "Deliveries are mostly from newly arrived stocks." },
            statementsOnRecord: { trigger: 'No', field: 'statementsRemark', label: 'Statements on Record', resp: 'Branch', text: "Stock statements are pending at branch." }
        };

        const Icons = {
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Print: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
            Loader: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
        };

        // --- CLOUD API INTEGRATION ---
        const CLOUD_SETTINGS_KEY = 'godown_cloud_settings';
        
        const utf8ToBase64 = (str) => btoa(unescape(encodeURIComponent(str)));
        const base64ToUtf8 = (str) => decodeURIComponent(escape(atob(str)));

        const getCloudSettings = () => {
            const saved = localStorage.getItem(CLOUD_SETTINGS_KEY);
            return saved ? JSON.parse(saved) : { token: '', owner: 'msgowdara', repo: 'HsgCalc', path: 'godownInspection.csv' };
        };

        const fetchFromCloud = async () => {
            const { token, owner, repo, path } = getCloudSettings();
            if (!token) throw new Error("No Cloud Token Configured");
            
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
            
            if (res.status === 404) return { data: [], sha: null }; 
            if (!res.ok) throw new Error(`Cloud API Error: ${res.statusText}`);
            
            const json = await res.json();
            const csvContent = base64ToUtf8(json.content);
            const parsed = Papa.parse(csvContent, { header: true, skipEmptyLines: true });
            
            return { data: parsed.data, sha: json.sha };
        };

        const pushToCloud = async (dataArray, currentSha) => {
            const { token, owner, repo, path } = getCloudSettings();
            if (!token) throw new Error("No Cloud Token Configured");

            const csvContent = Papa.unparse(dataArray);
            const encodedContent = utf8ToBase64(csvContent);

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const body = {
                message: "Update godown inspections data via App",
                content: encodedContent,
                ...(currentSha ? { sha: currentSha } : {})
            };

            const res = await fetch(url, {
                method: 'PUT',
                headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const errJson = await res.json();
                throw new Error(`Cloud Save Failed: ${errJson.message}`);
            }
        };

        const defaultFormState = {
            id: '', accountNo: '', name: '', nature: '', limit: '', sanctioningAuthority: 'BRCM',
            officeAddress: '', godownAddress: '', distance: '', branch: '', region: '',
            dateOfReporting: new Date().toISOString().split('T')[0],
            dateOfVerification: new Date().toISOString().split('T')[0],
            inspectingOfficer: '', 
            
            conditionOfGodown: 'Satisfactory', godownRemark: '',
            stockValue: '', stockMarginPercent: '25', stockMargin: '',
            bookDebts: '', bdMarginPercent: '25', bookDebtsMargin: '', 
            creditors: '', outstandingBalance: '',
            
            conditionOfStocks: 'Satisfactory', conditionOfStocksRemark: '', 
            modeOfStorage: 'Proper', modeOfStorageRemark: '',
            seasonYear: '', ageOfOldStockDays: '', amountOfOldStockRupees: '', percentOldStock: '',
            
            modeOfValuationSatisfactory: 'Satisfactory', valuationRemark: '',
            tradeDiscountDeducted: 'No', tradeDiscountRemark: '',
            unpledgedStocks: 'No', 
            
            insuranceAmount: '', 
            insuranceAdequate: 'Yes', insuranceAdequateRemark: '',
            insuranceComprehensive: 'Yes', insuranceComprehensiveRemark: '',
            unpledgedInsured: 'Not Applicable', unpledgedInsuredRemark: '',
            
            signboardsDisplayed: 'Yes', signboardsDisplayedRemark: '', 
            signboardsInsideOutside: 'Inside', 
            godownKeeperSanctioned: 'Yes', godownKeeperRemark: '',
            stockReportsRegular: 'Yes', stockReportsRemark: '', stockReportsFrequency: 'Monthly', 
            bankPossessionEffective: 'Yes', bankPossessionRemark: '',
            registersMaintained: 'Yes', registersMaintainedRemark: '',
            registersTally: 'Yes', registersTallyRemark: '',
            inspectedPeriodically: 'Yes', inspectedPeriodicallyRemark: '', inspectedHowOften: 'Quarterly by undersigned inspecting officer',
            recordMaintained: 'Yes', recordMaintainedRemark: '',
            
            turnoverSatisfactory: 'Yes', turnoverSatisfactoryRemark: '', 
            accountTurnoverSatisfactory: 'Yes', accountTurnoverSatisfactoryRemark: '',
            movementChecked: 'Yes', movementRemark: '',
            oldStockMoving: 'Yes', oldStockRemark: '',
            deliveriesNotNew: 'Yes', deliveriesRemark: '',
            statementsOnRecord: 'Yes', statementsRemark: ''
        };

        const App = () => {
            const [view, setView] = useState('dashboard'); 
            const [formData, setFormData] = useState(defaultFormState);
            const [inspections, setInspections] = useState([]);
            const [officers, setOfficers] = useState([]);
            const [toast, setToast] = useState('');
            
            // App & API States
            const [isFetching, setIsFetching] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [settingsInput, setSettingsInput] = useState(getCloudSettings());

            useEffect(() => {
                if(getCloudSettings().token) {
                    refreshDataFromCloud();
                } else {
                    setIsFetching(false);
                    setShowSettings(true); 
                }
            }, []);

            const refreshDataFromCloud = async () => {
                setIsFetching(true);
                try {
                    const { data } = await fetchFromCloud();
                    data.sort((a, b) => new Date(b.dateOfReporting) - new Date(a.dateOfReporting));
                    setInspections(data);
                    
                    const offSet = new Set();
                    data.forEach(d => { if (d.inspectingOfficer) offSet.add(d.inspectingOfficer) });
                    setOfficers(Array.from(offSet));
                } catch (e) {
                    console.error(e);
                    showToast("⚠️ Cloud Sync Failed: " + e.message);
                } finally {
                    setIsFetching(false);
                }
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4000);
            };

            const handleSaveSettings = () => {
                localStorage.setItem(CLOUD_SETTINGS_KEY, JSON.stringify(settingsInput));
                setShowSettings(false);
                showToast("⚙️ Cloud Settings Saved!");
                refreshDataFromCloud();
            };

            const handleSave = async () => {
                if (!getCloudSettings().token) return setShowSettings(true);
                
                setIsSaving(true);
                showToast("⏳ Syncing with Cloud...");
                try {
                    const cloudData = await fetchFromCloud();
                    let latestArray = cloudData.data || [];
                    
                    const reportId = formData.id || Date.now().toString();
                    const recordToSave = { 
                        ...formData, 
                        percentOldStock: calculateOldStockPercent(),
                        id: reportId, 
                        lastUpdated: new Date().toISOString() 
                    };
                    
                    const existingIndex = latestArray.findIndex(item => item.id === reportId);
                    if (existingIndex >= 0) {
                        latestArray[existingIndex] = recordToSave;
                    } else {
                        latestArray.push(recordToSave);
                    }
                    
                    await pushToCloud(latestArray, cloudData.sha);
                    
                    latestArray.sort((a, b) => new Date(b.dateOfReporting) - new Date(a.dateOfReporting));
                    setInspections(latestArray);
                    setFormData(recordToSave);
                    
                    showToast("☁️✅ Synced Successfully to CSV on Cloud!");
                    setView('preview');
                } catch (e) {
                    alert("Error syncing to Cloud. " + e.message);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDuplicate = (insp) => {
                const duplicatedData = {
                    ...insp,
                    id: '', 
                    dateOfReporting: new Date().toISOString().split('T')[0],
                    dateOfVerification: new Date().toISOString().split('T')[0]
                };
                setFormData(duplicatedData);
                setView('form');
                showToast("📝 Report duplicated! Update stock amounts & Save.");
            };

            const handleDelete = async (id) => {
                if (window.confirm("Delete this report permanently from Cloud?")) {
                    setIsSaving(true);
                    showToast("🗑️ Deleting from Cloud...");
                    try {
                        const cloudData = await fetchFromCloud();
                        const newArray = (cloudData.data || []).filter(item => item.id !== id);
                        await pushToCloud(newArray, cloudData.sha);
                        setInspections(newArray.sort((a, b) => new Date(b.dateOfReporting) - new Date(a.dateOfReporting)));
                        showToast("🗑️ Report successfully deleted from Cloud.");
                    } catch (e) {
                        alert("Failed to delete. " + e.message);
                    } finally {
                        setIsSaving(false);
                    }
                }
            };

            const handleAccountBlur = () => {
                if (!formData.accountNo) return;
                const history = inspections.filter(i => i.accountNo === formData.accountNo);
                if (history.length > 0) {
                    const last = history[0]; 
                    setFormData(prev => ({
                        ...prev,
                        name: last.name, nature: last.nature, limit: last.limit, sanctioningAuthority: last.sanctioningAuthority,
                        officeAddress: last.officeAddress, godownAddress: last.godownAddress, distance: last.distance, 
                        branch: last.branch, region: last.region, inspectingOfficer: last.inspectingOfficer || prev.inspectingOfficer,
                        conditionOfGodown: last.conditionOfGodown, conditionOfStocks: last.conditionOfStocks,
                        modeOfStorage: last.modeOfStorage, stockMarginPercent: last.stockMarginPercent, bdMarginPercent: last.bdMarginPercent,
                        signboardsDisplayed: last.signboardsDisplayed, signboardsInsideOutside: last.signboardsInsideOutside, 
                        insuranceAmount: last.insuranceAmount, insuranceAdequate: last.insuranceAdequate, insuranceComprehensive: last.insuranceComprehensive,
                        inspectedHowOften: last.inspectedHowOften, stockReportsFrequency: last.stockReportsFrequency,
                        godownKeeperSanctioned: last.godownKeeperSanctioned
                    }));
                    showToast("✨ Details auto-filled from Cloud History!");
                }
            };

            const handleNumberChange = (field, value) => {
                let newData = { ...formData, [field]: value };
                if (field === 'stockValue' || field === 'stockMarginPercent') {
                    const val = parseFloat(newData.stockValue) || 0;
                    const pct = parseFloat(newData.stockMarginPercent) || 0;
                    newData.stockMargin = (val * (pct / 100)).toFixed(2);
                }
                if (field === 'bookDebts' || field === 'bdMarginPercent') {
                    const val = parseFloat(newData.bookDebts) || 0;
                    const pct = parseFloat(newData.bdMarginPercent) || 0;
                    newData.bookDebtsMargin = (val * (pct / 100)).toFixed(2);
                }
                setFormData(newData);
            };

            const handleSelectChange = (field, value) => {
                let newData = { ...formData, [field]: value };

                // Handle static dependencies
                if (field === 'signboardsDisplayed') {
                    if (value === 'No') newData.signboardsInsideOutside = 'Not Applicable';
                    else if (value === 'Yes' && newData.signboardsInsideOutside === 'Not Applicable') newData.signboardsInsideOutside = 'Outside';
                }
                if (field === 'unpledgedStocks') {
                    if (value === 'No') newData.unpledgedInsured = 'Not Applicable';
                    else if (value === 'Yes' && newData.unpledgedInsured === 'Not Applicable') newData.unpledgedInsured = 'Yes';
                }

                // Apply Auto-Suggested Remarks Logic
                if (SUGGESTED_REMARKS[field]) {
                    const config = SUGGESTED_REMARKS[field];
                    if (value === config.trigger) {
                        if (!newData[config.field]) {
                            newData[config.field] = config.text; // Auto-fill suggestion
                        }
                    } else {
                        newData[config.field] = ''; // Clear if changed back to positive
                    }
                }
                
                setFormData(newData);
            };

            const calculateDP = () => {
                const s = parseFloat(formData.stockValue) || 0;
                const sm = parseFloat(formData.stockMargin) || 0;
                const bd = parseFloat(formData.bookDebts) || 0;
                const bdm = parseFloat(formData.bookDebtsMargin) || 0;

                                                <div className="bg-slate-50 p-4 rounded border border-slate-200">
                                                    <h4 className="text-sm font-bold text-slate-800 mb-3 border-b pb-1">Insurance</h4>
                                                    <div className="mb-4"><label className="block text-xs font-bold text-slate-600 mb-1">Amount of Insurance (₹)</label><input type="number" className="w-full border-slate-300 rounded px-3 py-2 border text-sm" value={formData.insuranceAmount} onChange={e => handleSelectChange('insuranceAmount', e.target.value)} /></div>
                                                    {renderFieldWithRemark('Is Insurance cover adequate?', 'insuranceAdequate', 'yesNo', 'insuranceAdequateRemark', 'No')}
                                                    {renderFieldWithRemark('Is insurance cover all comprehensive?', 'insuranceComprehensive', 'yesNo', 'insuranceComprehensiveRemark', 'No')}
                                                    {formData.unpledgedStocks === 'Yes' && (
                                                        renderFieldWithRemark('Are unpledged stocks adequately insured?', 'unpledgedInsured', 'yesNo', 'unpledgedInsuredRemark', 'No')
                                                    )}
                                                </div>
                                            </div>

                                            <div className="bg-slate-50 p-4 rounded border border-slate-200">
                                                <h4 className="text-sm font-bold text-slate-800 mb-3 border-b pb-1">General Compliances & Records</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                                    <div>{renderFieldWithRemark('Are bank’s signboards displayed?', 'signboardsDisplayed', 'yesNo', 'signboardsDisplayedRemark', 'No')}</div>
                                                    <div><label className="block text-xs font-bold text-slate-600 mb-1">Inside / Outside</label><select className="w-full border-slate-300 rounded px-2 py-1.5 border bg-white text-sm disabled:bg-gray-200" disabled={formData.signboardsDisplayed === 'No'} value={formData.signboardsInsideOutside} onChange={e => handleSelectChange('signboardsInsideOutside', e.target.value)}>{DROPDOWNS.insideOutside.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select></div>
                                                    <div className="sm:col-span-2 md:col-span-1">{renderFieldWithRemark('Godown keeper/chokidar sanctioned?', 'godownKeeperSanctioned', 'yesNo', 'godownKeeperRemark', 'No')}</div>
                                                    
                                                    <div className="sm:col-span-2 md:col-span-1">{renderFieldWithRemark('Signed stock reports received?', 'stockReportsRegular', 'yesNo', 'stockReportsRemark', 'No')}</div>
                                                    <div><label className="block text-xs font-bold text-slate-600 mb-1">Report Frequency</label><select className="w-full border-slate-300 rounded px-2 py-1.5 border bg-white text-sm" value={formData.stockReportsFrequency} onChange={e => handleSelectChange('stockReportsFrequency', e.target.value)}>{DROPDOWNS.frequency.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select></div>
                                                    
                                                    <div className="sm:col-span-2 md:col-span-1">{renderFieldWithRemark('Bank possession fully effective?', 'bankPossessionEffective', 'yesNo', 'bankPossessionRemark', 'No')}</div>
                                                    <div className="sm:col-span-2 md:col-span-1">{renderFieldWithRemark('Registers/cards properly maintained?', 'registersMaintained', 'yesNo', 'registersMaintainedRemark', 'No')}</div>
                                                    <div className="sm:col-span-2 md:col-span-1">{renderFieldWithRemark('Registers tally with godown cards?', 'registersTally', 'yesNo', 'registersTallyRemark', 'No')}</div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div className="bg-slate-50 p-4 rounded border border-slate-200">
                                                    <h4 className="text-sm font-bold text-slate-800 mb-3 border-b pb-1">Control</h4>
                                                    {renderFieldWithRemark('Are godown inspected periodically?', 'inspectedPeriodically', 'yesNo', 'inspectedPeriodicallyRemark', 'No')}
                                                    <div className="mb-4"><label className="block text-xs font-bold text-slate-600 mb-1">How often and by whom?</label><input type="text" className="w-full border-slate-300 rounded px-3 py-2 border bg-white text-sm" value={formData.inspectedHowOften} onChange={e => handleSelectChange('inspectedHowOften', e.target.value)} /></div>
                                                    {renderFieldWithRemark('Is record of inspection maintained?', 'recordMaintained', 'yesNo', 'recordMaintainedRemark', 'No')}
                                                </div>

                                                <div className="bg-slate-50 p-4 rounded border border-slate-200">
                                                    <h4 className="text-sm font-bold text-slate-800 mb-3 border-b pb-1">Movement of Stocks</h4>
                                                    <div>{renderFieldWithRemark('Is turnover in stocks satisfactory?', 'turnoverSatisfactory', 'yesNo', 'turnoverSatisfactoryRemark', 'No')}</div>
                                                    <div>{renderFieldWithRemark('Is turnover in account satisfactory?', 'accountTurnoverSatisfactory', 'yesNo', 'accountTurnoverSatisfactoryRemark', 'No')}</div>
                                                </div>
                                            </div>

                                            <div className="bg-slate-50 p-4 rounded border border-slate-200">
                                                <h4 className="text-sm font-bold text-slate-800 mb-3 border-b pb-1">10. Officer Certificates</h4>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    {renderFieldWithRemark('The movement of stocks in the account has been carefully checked.', 'movementChecked', 'yesNo', 'movementRemark', 'No')}
                                                    {renderFieldWithRemark('Stock older that three months are also moving out satisfactorily.', 'oldStockMoving', 'yesNo', 'oldStockRemark', 'No')}
                                                    {renderFieldWithRemark('Deliveries effected since last inspection have not been preponderating from new stocks.', 'deliveriesNotNew', 'yesNo', 'deliveriesRemark', 'No')}
                                                    {renderFieldWithRemark('All the stocks statements of the borrower are on branch record.', 'statementsOnRecord', 'yesNo', 'statementsRemark', 'No')}
                                                </div>
                                            </div>
                                            
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-4 mt-6">
                                        <button onClick={() => setView('preview')} className="bg-slate-200 hover:bg-slate-300 text-slate-800 px-6 py-3 rounded shadow-sm font-bold transition">Preview</button>
                                        <button onClick={handleSave} disabled={isSaving} className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded shadow font-bold text-lg transition flex items-center gap-2 disabled:opacity-50">
                                            <Icons.Save /> {isSaving ? 'Syncing...' : 'Save to Cloud'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* EXACT WORD DOCUMENT PRINT/PREVIEW VIEW */}
                            {view === 'preview' && (
                                <div id="report-container" className="relative">
                                    
                                    {/* PRINT ONLY REPEATING FOOTER */}
                                    <div className="print-only-footer">
                                        Godown Inspection Report - {formData.accountNo || '__________'} - {formData.name || '__________'}
                                    </div>

                                    {/* MAIN REPORT PAGE */}
                                    <div className="a4-page word-doc">
                                        <div className="text-center border-b-2 border-black pb-3 mb-6">
                                            <h1 style={{fontSize: '18pt', fontWeight: 'bold', textTransform: 'uppercase'}}>BANK OF BARODA</h1>
                                            <h2 style={{fontSize: '12pt', fontWeight: 'bold', textTransform: 'uppercase', marginTop: '4pt'}}>
                                                {formData.branch ? `${formData.branch} BRANCH` : '______________ BRANCH'}, {formData.region ? `${formData.region} REGION` : '______________ REGION'}
                                            </h2>
                                        </div>

                                        <div className="text-right font-bold mb-4">
                                            {formatDateCompact(formData.dateOfReporting)} {formData.name} {formData.accountNo}
                                        </div>

                                        <h1 className="text-center font-bold" style={{fontSize: '13pt', textDecoration: 'underline'}}>GODOWN INSPECTION REPORT</h1>
                                        <br/>

                                        <div className="doc-grid"><div>Date of Reporting</div><div>{formatDateStandard(formData.dateOfReporting)}</div></div>
                                        <div className="doc-grid"><div>Branch- </div><div>{formData.branch}</div></div>
                                        <div className="doc-grid"><div> Region-</div><div>{formData.region}</div></div>
                                        <div className="doc-grid"><div>Date of Stock Verification</div><div>{formatDateStandard(formData.dateOfVerification)}</div></div>
                                        <div className="doc-grid"><div>Inspecting Officer</div><div>{formData.inspectingOfficer}</div></div>
                                        <br/>
                                        <div className="doc-grid"><div>Name of account & its nature</div><div>{formData.name} {formData.nature ? `- ${formData.nature}` : ''} - {formData.accountNo}</div></div>
                                        <div className="doc-grid"><div>Limit</div><div>{formatCurrency(formData.limit)}</div></div>
                                        <div className="doc-grid"><div>Sanctioning Authority</div><div>{formData.sanctioningAuthority}</div></div>
                                        
                                        <h2>PARTICULARS OF THE GODOWN</h2>
                                        <div className="doc-grid"><div>Location</div><div>Office Address : {formData.officeAddress}<br/>Godown Address : {formData.godownAddress}</div></div>
                                        <div className="doc-grid"><div>Distance</div><div>{formData.distance}</div></div>
                                        <div className="doc-grid"><div>Condition of Godown</div><div>{formatPrintValue(formData.conditionOfGodown, formData.godownRemark)}</div></div>

                                        <h2>STOCKS</h2>
                                        <div className="doc-grid"><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a) Value of stock pledged/Hypothecated </div><div>{formatCurrency(formData.stockValue)}</div></div>
                                        <div className="doc-grid"><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Less margin(Stock) @ {formData.stockMarginPercent}%</div><div>{formatCurrency(formData.stockMargin)}</div></div>
                                        <div className="doc-grid"><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Book Debts                                         </div><div>{formatCurrency(formData.bookDebts)}</div></div>
                                        <div className="doc-grid"><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Creditors                                             </div><div>{formatCurrency(formData.creditors)}</div></div>
                                        <div className="doc-grid"><div>Less Margin (BD) @ {formData.bdMarginPercent}%</div><div>{formatCurrency(formData.bookDebtsMargin)}</div></div>
                                        <div className="doc-grid"><div>Drawing Power</div><div>{formatCurrency(calculateDP())}</div></div>
                                        <div className="doc-grid"><div>Outstanding balance</div><div>{formatCurrency(formData.outstandingBalance)}</div></div>
                                        <br/>
                                        
                                        <div className="doc-grid"><div>Season/Year of purchase of manufactured goods</div><div>{formData.seasonYear || '-'}</div></div>
                                        <div className="doc-grid"><div>Age & amount of old stock</div><div>{(formData.ageOfOldStockDays || '0')} Days & {formatCurrency(formData.amountOfOldStockRupees || '0')}</div></div>
                                        <div className="doc-grid"><div>Percentage of old stocks to total stocks</div><div>{calculateOldStockPercent()}</div></div>

                                        <div className="doc-grid"><div>Condition of stocks</div><div>{formatPrintValue(formData.conditionOfStocks, formData.conditionOfStocksRemark)}</div></div>
                                        <div className="doc-grid"><div>Mode of storage (Proper/Haphazard)</div><div>{formatPrintValue(formData.modeOfStorage, formData.modeOfStorageRemark)}</div></div>

                                        <h2>VALUATION</h2>
                                        <div className="doc-grid"><div>Is the mode of Valuation Satisfactory</div><div>{formatPrintValue(formData.modeOfValuationSatisfactory, formData.valuationRemark)}</div></div>
                                        <div className="doc-grid"><div>Whether trade discount, if any, allowed is deducted while arriving at the value      of stocks</div><div>{formatPrintValue(formData.tradeDiscountDeducted, formData.tradeDiscountRemark)}</div></div>
                                        <div className="doc-grid"><div>Unpledged stocks, if any stored in the godown</div><div>{formData.unpledgedStocks}</div></div>

                                        <h2>INSURANCE</h2>
                                        <div className="doc-grid"><div>Amount of Insurance</div><div>{formatCurrency(formData.insuranceAmount)}</div></div>
                                        <div className="doc-grid"><div>Is Insurance cover adequate as to the amount</div><div>{formatPrintValue(formData.insuranceAdequate, formData.insuranceAdequateRemark)}</div></div>
                                        <div className="doc-grid"><div>Is insurance cover all comprehensive, state if any fire or R.R.C burglary etc</div><div>{formatPrintValue(formData.insuranceComprehensive, formData.insuranceComprehensiveRemark)}</div></div>
                                        {formData.unpledgedStocks === 'Yes' && (
                                            <div className="doc-grid"><div>Are unpledged stocks, if any adequately insured</div><div>{formatPrintValue(formData.unpledgedInsured, formData.unpledgedInsuredRemark)}</div></div>
                                        )}

                                        <h2>IN ALL CASES</h2>
                                        <div className="doc-grid"><div>Are bank’s signboards displayed? </div><div>{formatPrintValue(formData.signboardsDisplayed, formData.signboardsDisplayedRemark)}</div></div>
                                        {formData.signboardsDisplayed === 'Yes' && (
                                            <div className="doc-grid"><div>"(State whether inside or outside, if not outside, state authority)	"</div><div>{formData.signboardsInsideOutside}</div></div>
                                        )}
                                        <div className="doc-grid"><div>If godown keeper/ godown chokidar sanctioned? 		</div><div>{formatPrintValue(formData.godownKeeperSanctioned, formData.godownKeeperRemark)}</div></div>
                                        <div className="doc-grid"><div>Are duly signed stock reports received regularly?		</div><div>{formatPrintValue(formData.stockReportsRegular, formData.stockReportsRemark)}</div></div>
                                        <div className="doc-grid"><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(State frequency)</div><div>{formData.stockReportsFrequency}</div></div>
                                        <div className="doc-grid"><div>Is bank’s possession fully effective and secured? 		</div><div>{formatPrintValue(formData.bankPossessionEffective, formData.bankPossessionRemark)}</div></div>

                                        <h2>7. BOOKS AND RECORDS</h2>
                                        <div className="doc-grid"><div>Are godown registers/ cards properly maintained?</div><div>{formatPrintValue(formData.registersMaintained, formData.registersMaintainedRemark)}</div></div>
                                        <div className="doc-grid"><div>Do godown registers tally with godown cards?</div><div>{formatPrintValue(formData.registersTally, formData.registersTallyRemark)}</div></div>

                                        <h2>8. CONTROL</h2>
                                        <div className="doc-grid"><div>Are godown inspected periodically? </div><div>{formatPrintValue(formData.inspectedPeriodically, formData.inspectedPeriodicallyRemark)}</div></div>
                                        <div className="doc-grid"><div>How often and by whom? </div><div>{formData.inspectedHowOften}</div></div>
                                        <div className="doc-grid"><div>Is record of inspection maintained?</div><div>{formatPrintValue(formData.recordMaintained, formData.recordMaintainedRemark)}</div></div>

                                        <h2>9. MOVEMENT OF STOCKS</h2>
                                        <div className="doc-grid"><div>Is turnover in stocks satisfactory? </div><div>{formatPrintValue(formData.turnoverSatisfactory, formData.turnoverSatisfactoryRemark)}</div></div>
                                        <div className="doc-grid" style={{alignItems: 'start'}}><div>Is turnover in account satisfactory? 	</div><div>{formatPrintValue(formData.accountTurnoverSatisfactory, formData.accountTurnoverSatisfactoryRemark)}</div></div>

                                        <h2>10. CERTIFICATE TO BE GIVEN BY THE INSPECTING OFFICER CERTIFYING THAT</h2>
                                        <div className="doc-grid"><div>The movement of stocks in the account has been carefully checked. </div><div>{formatPrintValue(formData.movementChecked, formData.movementRemark)}</div></div>
                                        <div className="doc-grid"><div>Stock older that three months are also moving out satisfactorily. </div><div>{formatPrintValue(formData.oldStockMoving, formData.oldStockRemark)}</div></div>
                                        <div className="doc-grid"><div>Deliveries effected since last inspection have not been preponderating from new stocks.</div><div>{formatPrintValue(formData.deliveriesNotNew, formData.deliveriesRemark)}</div></div>
                                        <div className="doc-grid"><div>All the stocks statements of the borrower are on branch record.</div><div>{formatPrintValue(formData.statementsOnRecord, formData.statementsRemark)}</div></div>

                                        <div style={{fontSize: '9pt', fontStyle: 'italic', marginTop: '30pt', marginBottom: '50pt'}}>
                                            Note: Please refer Guidelines in the reverse	      
                                        </div>

                                        <div style={{display: 'flex', justifyContent: 'space-between', padding: '0 40pt'}}>
                                            <div style={{textAlign: 'center', fontWeight: 'bold'}}>
                                                <div style={{minHeight: '1.5em', marginBottom: '4pt'}}>{formData.inspectingOfficer ? formData.inspectingOfficer.toUpperCase() : ''}</div>
                                                <div>INSPECTING OFFICER</div>
                                            </div>
                                            <div style={{textAlign: 'center', fontWeight: 'bold', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end'}}>
                                                <div>MANAGER</div>
                                            </div>
                                        </div>

                                        {/* SCREEN ONLY FOOTER FOR PREVIEW */}
                                        <div className="screen-only-footer mt-12 pt-4 border-t border-black text-center font-bold text-[11pt]">
                                            Godown Inspection Report - {formData.accountNo || '__________'} - {formData.name || '__________'}
                                        </div>
                                    </div>

                                    {/* BRANCH HEAD COVERING LETTER (NEW PAGE) */}
                                    <div className="a4-page word-doc page-break-before">
                                        <h2 style={{ textAlign: 'center', textDecoration: 'underline', marginBottom: '30pt' }}>INTERNAL MEMO</h2>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '20pt' }}>
                                            <div>
                                                <strong>To:</strong><br/>
                                                The Branch Head,<br/>
                                                Bank of Baroda, {formData.branch} Branch
                                            </div>
                                            <div><strong>Date:</strong> {formatDateStandard(formData.dateOfReporting) || new Date().toLocaleDateString('en-GB')}</div>
                                        </div>
                                        <div style={{ marginBottom: '20pt' }}>
                                            <strong>Subject:</strong> Outcome of Godown Inspection - {formData.name} (A/c: {formData.accountNo})
                                        </div>
                                        <p style={{ marginBottom: '15pt' }}>Dear Sir/Madam,</p>
                                        <p style={{ marginBottom: '15pt' }}>
                                            The regular godown inspection for the subject account was conducted on {formatDateStandard(formData.dateOfVerification)}. 
                                            {adverseFindings.length === 0 
                                                ? " We are pleased to report that no adverse observations were noted during the visit. The condition of stocks and maintenance of records are satisfactory." 
                                                : " During the visit, the following irregularities/adverse findings were observed. We suggest the below rectification measures for monitoring by the Credit Department and follow-up action."}
                                        </p>

                                        {adverseFindings.length > 0 && (
                                            <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: '15pt', marginBottom: '20pt', fontSize: '10pt' }} border="1">
                                                <thead>
                                                    <tr style={{ backgroundColor: '#f0f0f0' }}>
                                                        <th style={{ padding: '8px' }}>Sl</th>
                                                        <th style={{ padding: '8px' }}>Parameter</th>
                                                        <th style={{ padding: '8px' }}>Adverse Observation</th>
                                                        <th style={{ padding: '8px' }}>Suggested Rectification Measure</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {adverseFindings.map((item, idx) => (
                                                        <tr key={idx}>
                                                            <td style={{ padding: '8px', textAlign: 'center' }}>{idx + 1}</td>
                                                            <td style={{ padding: '8px', fontWeight: 'bold' }}>{item.label}</td>
                                                            <td style={{ padding: '8px' }}>{item.userRemark}</td>
                                                            <td style={{ padding: '8px' }}>{item.suggestion}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        )}
                                        
                                        <p>Submitted for your information and necessary action.</p>
                                        <div style={{ marginTop: '50pt' }}>
                                            <strong>{formData.inspectingOfficer ? formData.inspectingOfficer.toUpperCase() : 'INSPECTING OFFICER'}</strong><br/>
                                            Inspecting Official
                                        </div>
                                    </div>

                                    {/* BORROWER RECTIFICATION LETTER (NEW PAGE - CONDITIONAL) */}
                                    {borrowerFindings.length > 0 && (
                                        <div className="a4-page word-doc page-break-before">
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '20pt' }}>
                                                <div>
                                                    <strong>To:</strong><br/>
                                                    {formData.name}<br/>
                                                    {formData.officeAddress}
                                                </div>
                                                <div><strong>Date:</strong> {formatDateStandard(formData.dateOfReporting) || new Date().toLocaleDateString('en-GB')}</div>
                                            </div>
                                            <div style={{ marginBottom: '20pt' }}>
                                                <strong>Subject:</strong> Rectification of irregularities observed during Godown Inspection dated {formatDateStandard(formData.dateOfVerification)}
                                            </div>
                                            <p style={{ marginBottom: '15pt' }}>Dear Sir/Madam,</p>
                                            <p style={{ marginBottom: '15pt' }}>
                                                During the routine godown inspection of your premises located at <em>{formData.godownAddress}</em> on {formatDateStandard(formData.dateOfVerification)}, the following irregularities were observed.
                                            </p>
                                            <p style={{ marginBottom: '15pt' }}>You are advised to take immediate corrective actions as suggested below:</p>
                                            
                                            <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: '15pt', marginBottom: '20pt', fontSize: '10pt' }} border="1">
                                                <thead>
                                                    <tr style={{ backgroundColor: '#f0f0f0' }}>
                                                        <th style={{ padding: '8px' }}>Sl</th>
                                                        <th style={{ padding: '8px' }}>Area of Concern</th>
                                                        <th style={{ padding: '8px' }}>Observation Details</th>
                                                        <th style={{ padding: '8px' }}>Required Action by You</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {borrowerFindings.map((item, idx) => (
                                                        <tr key={idx}>
                                                            <td style={{ padding: '8px', textAlign: 'center' }}>{idx + 1}</td>
                                                            <td style={{ padding: '8px', fontWeight: 'bold' }}>{item.label}</td>
                                                            <td style={{ padding: '8px' }}>{item.userRemark}</td>
                                                            <td style={{ padding: '8px' }}>{item.suggestion}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            
                                            <p>Please confirm compliance of the above points at the earliest to ensure smooth continuation of your credit facilities.</p>
                                            <div style={{ marginTop: '50pt' }}>
                                                Yours faithfully,<br/><br/><br/>
                                                <strong>Manager / Branch Head</strong><br/>
                                                Bank of Baroda, {formData.branch} Branch
                                            </div>
                                        </div>
                                    )}

                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
