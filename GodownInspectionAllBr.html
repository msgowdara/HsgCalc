<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Godown Inspector</title>
    <script>

        try { localStorage.removeItem('godown_cloud_settings_v3'); } catch (e) { /* storage not available */ }
        location.replace('GodownInspection.html');
    </script>
    <meta http-equiv="refresh" content="0; url=GodownInspection.html">
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; padding: 24px; color: #1e293b;">

</body>
